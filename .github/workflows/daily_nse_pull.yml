name: Daily NSE Pull + Kaggle Update

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Re-download every symbol's whole history, not only the recent sessions
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# One writer at a time: a manual run must not race the scheduled one to push the master.
concurrency:
  group: nse-pull
  cancel-in-progress: false

env:
  ALERT_LABEL: pipeline-failure

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Python 3.12 is the oldest version the pinned numpy supports (see requires-python).
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new NSE data
        id: fetch
        env:
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            python scripts/fetch_daily.py --full-refresh
          else
            python scripts/fetch_daily.py
          fi

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/nifty500_ohlcv_raw.parquet data/raw/coverage_report.csv
          git diff --staged --quiet || git commit -m "Auto: NSE data update $(date +'%Y-%m-%d')"
          # Someone may have pushed while the fetch ran; replay on top rather than fail.
          git pull --rebase origin main
          git push origin main

      - name: Push new Kaggle dataset version
        id: kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          python - <<'PY' > ~/.kaggle/kaggle.json
          import json, os
          print(json.dumps({"username": os.environ["KAGGLE_USERNAME"],
                            "key": os.environ["KAGGLE_KEY"]}))
          PY
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets version -p data/raw -m "Auto update: $(date +'%Y-%m-%d')" --dir-mode zip

      # A scheduled job with no alerting is a job you do not have: this pipeline
      # failed 50 times in a row without anyone noticing. On failure, raise one
      # tracking issue (and comment on it thereafter rather than filing a new one
      # every weekday); on the next success, close it.
      - name: Identify the failing step
        if: failure()
        id: failing
        run: |
          # Read outcomes from the runner: while the job is still in progress the
          # REST API has not recorded step conclusions, so querying it there
          # reports "unknown step" on every alert.
          failed=""
          [ "${{ steps.fetch.outcome }}" = "failure" ] && failed="Fetch new NSE data"
          [ "${{ steps.commit.outcome }}" = "failure" ] && failed="${failed:+$failed, }Commit updated data"
          [ "${{ steps.kaggle.outcome }}" = "failure" ] && failed="${failed:+$failed, }Push new Kaggle dataset version"
          echo "name=${failed:-setup or checkout (no pipeline step recorded a failure)}" >> "$GITHUB_OUTPUT"

      - name: Raise or update the failure issue
        if: failure()
        uses: ./.github/actions/alert-issue
        with:
          mode: open
          label: ${{ env.ALERT_LABEL }}
          title: Daily NSE pull is failing
          token: ${{ secrets.GITHUB_TOKEN }}
          detail: |
            The scheduled data pull failed and the dataset is no longer updating.

            **Failing step:** `${{ steps.failing.outputs.name }}`

            Known causes for this pipeline, most likely first:

            1. `yfinance` broke against the Yahoo API again — check whether the log
               says `FAIL: no data came back for ...`. The pin in `requirements.txt`
               needs a bump.
            2. More than 10% of symbols returned nothing, or their history refresh
               failed — upstream is degraded, or the constituents list has drifted.
            3. The response schema changed (`the upstream response has no [...]
               column(s)`) — again a yfinance version problem.
            4. LFS objects were not checked out, so `pd.read_parquet` got a pointer
               stub. Confirm `lfs: true` is still on the checkout step.

      - name: Close the failure issue after a recovery
        if: success()
        uses: ./.github/actions/alert-issue
        with:
          mode: close
          label: ${{ env.ALERT_LABEL }}
          title: Daily NSE pull is failing
          token: ${{ secrets.GITHUB_TOKEN }}
